<link rel="stylesheet" href="/styles/styles.css" />
<!-- Audience redirect: if user previously chose the Leader experience, send them there
     before any content renders. Runs sync so there is no flash of the wrong page. -->
<script nonce="aem">
  try {
    if (localStorage.getItem('gs-audience') === 'leader'
        && !window.location.pathname.startsWith('/leaders')) {
      window.location.replace('/leaders');
    }
  } catch (e) {
    /* localStorage unavailable */
  }
</script>
<!-- CLS: apply shorter header min-height before first paint when offer was dismissed this session (header loads lazy). -->
<script nonce="aem">
  try {
    if (sessionStorage.getItem('gs-header-offer-dismissed') === 'true') {
      document.documentElement.classList.add('header-offer-dismissed');
    }
  } catch (e) {
    /* sessionStorage unavailable */
  }
</script>
<!-- CLS: pre-apply the cached no-offer header height (offer is always delayed 3 s) so the spacer is correct before JS runs. -->
<script nonce="aem">
  try {
    var gs_h = localStorage.getItem('gs-header-nav-height');
    if (gs_h) document.documentElement.style.setProperty('--gs-header-height-cache', gs_h);
  } catch (e) { /* storage unavailable */ }
</script>
